name: release

# Builds every shippable artifact for a tag and publishes them to one GitHub
# Release (the `build` workflow only validates; this one ships). On tag `v*`:
#
#   meta      resolve the WSL fork commit and kernel version the MSI must match
#   packages  DKMS module packages (.deb / .rpm / .pkg.tar.zst)   matrix
#   vhd       modules vhd with hv_vmsmb injected (Linux: make vhd)
#   msi       patched WSL installer bundling that kernel + vhd (Windows, native)
#   publish   attach packages + vhd + msi to the Release
#
# Two environment facts shape the split:
#   * Hosted windows-latest has no nested virtualization, so WSL2 won't run there
#     and `make msi` (which runs inside WSL) can't be used in CI. The msi job
#     reproduces the Makefile's MSI steps natively (cmake + vcvars + UseEnv).
#   * The MSI bundles the kernel pinned in the WSL fork's packages.config, so the
#     injected modules vhd must be built for THAT version, not the newest on the
#     feed — `meta` reads the pin and `vhd` builds against it.
# Release scope is official mode only (a custom/xanmod kernel needs a local
# .wslconfig + prebuilt tree that a hosted runner can't reproduce).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      wsl_repo:
        description: "Patched WSL fork (github.com/<owner>/WSL)"
        default: "https://github.com/Vigilans/WSL"
      wsl_ref:
        description: "Patched WSL fork branch, tag, or commit SHA"
        default: "virtual-smb"

permissions:
  contents: read

env:
  WSL_REPO: ${{ github.event.inputs.wsl_repo || 'https://github.com/Vigilans/WSL' }}
  WSL_REF: ${{ github.event.inputs.wsl_ref || 'virtual-smb' }}

jobs:
  # The MSI ships the kernel the fork pins in packages.config; read that version
  # once so vhd builds against it and the names line up across jobs.
  meta:
    name: resolve kernel pin
    runs-on: ubuntu-latest
    outputs:
      kver: ${{ steps.pin.outputs.kver }}
      wsl_sha: ${{ steps.pin.outputs.wsl_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate package version
        run: |
          set -eux
          pkgver=$(sed -n 's/^PACKAGE_VERSION="\([^"]*\)"/\1/p' dkms.conf)
          rpmver=$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/hv-vmsmb-dkms.spec)
          test -n "$pkgver"
          test "$rpmver" = "$pkgver"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$pkgver"
          fi

      - name: Read Microsoft.WSL.Kernel pin from the WSL fork
        id: pin
        run: |
          set -eux
          git init wslfork
          git -C wslfork remote add origin "$WSL_REPO"
          git -C wslfork fetch --depth 1 origin "$WSL_REF"
          git -C wslfork checkout --detach FETCH_HEAD
          wsl_sha=$(git -C wslfork rev-parse HEAD)
          kver=$(sed -n 's/.*Microsoft\.WSL\.Kernel" *version="\([^"]*\)".*/\1/p' wslfork/packages.config)
          test -n "$kver"
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "wsl_sha=$wsl_sha" >> "$GITHUB_OUTPUT"

  # DKMS packages — source ships in the package and compiles on the target, so
  # this validates the recipe (same as build.yml's package job) and produces the
  # release artifact. Mirrors build.yml; keep the two in step.
  packages:
    name: package (${{ matrix.fmt }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: deb, image: "debian:trixie" }
          - { fmt: rpm, image: "fedora:latest" }
          - { fmt: arch, image: "archlinux:latest" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build ${{ matrix.fmt }} package
        run: |
          set -eux
          case "${{ matrix.fmt }}" in
          deb)
            apt-get update
            apt-get install -y --no-install-recommends \
              make build-essential dpkg-dev debhelper dh-dkms git linux-headers-amd64
            git config --global --add safe.directory "$PWD"
            make deb
            mkdir -p out && cp build/debian/*.deb out/
            apt-get install -y ./build/debian/hv-vmsmb-dkms_*.deb
            dkms status | grep -q "hv-vmsmb.*installed"
            ;;
          rpm)
            dnf install -y make rpm-build git
            git config --global --add safe.directory "$PWD"
            make rpm
            mkdir -p out && cp rpmbuild/RPMS/noarch/*.rpm out/
            ;;
          arch)
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Syu --noconfirm --needed --overwrite '*' base-devel git
            git config --global --add safe.directory '*'
            sed -i "s#source=(.*#source=(\"\${_pkgbase}::git+file://$GITHUB_WORKSPACE\")#" packaging/arch/PKGBUILD
            useradd -m builder
            chown -R builder .
            su builder -c "git config --global --add safe.directory '*'; cd packaging/arch && makepkg -f --nodeps --skipinteg"
            mkdir -p out && cp packaging/arch/*.pkg.tar.zst out/
            ;;
          esac

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.fmt }}
          path: out/*

  # modules vhd with hv_vmsmb injected, built for the pinned kernel so it matches
  # the MSI. Official mode (no .wslconfig present): make vhd downloads the nuget
  # kernel + source, reconstructs Module.symvers, compiles the module, and repacks
  # the nuget modules.vhd — no kernel compile, a few minutes.
  vhd:
    name: modules vhd
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio xz-utils \
            qemu-utils e2fsprogs python3 curl ca-certificates unzip kmod

      - name: make vhd (KVER=${{ needs.meta.outputs.kver }})
        run: make -C packaging/wsl vhd KVER="${{ needs.meta.outputs.kver }}"

      - name: Upload modules vhd
        uses: actions/upload-artifact@v4
        with:
          name: modules-vhd
          path: build/wsl/modules-${{ needs.meta.outputs.kver }}.vhd

  # Patched WSL installer. windows-latest can't run WSL2, so this reproduces the
  # Makefile's msi recipe natively: configure (restores the pinned nuget kernel +
  # its modules.vhd), overwrite that modules.vhd with ours (the kernel stays the
  # official pinned one — official mode doesn't touch the kernel), then build the
  # msipackage target under vcvars with /p:UseEnv=true (so msbuild uses the
  # dev-shell toolchain — the atls.lib fix).
  msi:
    name: WSL MSI
    runs-on: windows-latest
    needs: [meta, vhd]
    steps:
      - name: Clone WSL fork ${{ needs.meta.outputs.wsl_sha }}
        run: |
          git init wslfork
          git -C wslfork remote add origin "$env:WSL_REPO"
          git -C wslfork fetch --depth 1 origin "${{ needs.meta.outputs.wsl_sha }}"
          git -C wslfork checkout --detach FETCH_HEAD

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Download modules vhd
        uses: actions/download-artifact@v4
        with:
          name: modules-vhd
          path: vhd

      - name: Configure (restores the pinned kernel package)
        working-directory: wslfork
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bundle our modules vhd (kernel stays the official pinned one)
        shell: pwsh
        run: |
          $kver = "${{ needs.meta.outputs.kver }}"
          $ksd  = "wslfork/build/packages/Microsoft.WSL.Kernel.$kver/build/native/bin/x64"
          Copy-Item -Force "vhd/modules-$kver.vhd" "$ksd/modules.vhd"

      - name: Build msipackage (vcvars + UseEnv=true)
        shell: cmd
        working-directory: wslfork
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --target msipackage -- /m /p:UseEnv=true

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: wsl-msi
          path: wslfork/build/bin/x64/Release/wsl.msi

  publish:
    name: publish release
    needs: [meta, packages, vhd, msi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Stage release files
        run: |
          set -eux
          mkdir -p out
          find release -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \
            -o -name '*.vhd' -o -name 'wsl.msi' \) -exec cp {} out/ \;
          ls -l out

      - name: Build release body
        run: |
          ver='${{ github.ref_name }}'
          kver='${{ needs.meta.outputs.kver }}'
          wsl_sha='${{ needs.meta.outputs.wsl_sha }}'
          wsl_branch_url="${WSL_REPO%.git}/tree/$WSL_REF"
          wsl_short="${wsl_sha::7}"
          {
            echo "hv_vmsmb \`$ver\` — a VirtualSmb (SMB-over-VMBus) host-share filesystem client for Hyper-V Linux guests."
            echo
            echo "**Artifacts**"
            echo "- \`*.deb\` / \`*.rpm\` / \`*.pkg.tar.zst\` — DKMS module packages for native Linux distros (compile on the target; kernel-agnostic)"
            echo "- \`wsl.msi\` — patched WSL installer ([WSL fork]($wsl_branch_url), resolved \`$wsl_short\`); one-click, bundles kernel \`$kver\` + the \`hv_vmsmb\` modules vhd"
            echo "- \`modules-*.vhd\` — standalone modules vhd (kernel \`$kver\`) for the manual \`.wslconfig\` route on existing WSL"
            echo
            echo "See packaging/wsl/README.md for \`.wslconfig\` setup."
            echo
            echo "**Checksums (sha256)**"
            echo '```'
            ( cd out && sha256sum * )
            echo '```'
          } > body.md
          cat body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: body.md             # version + kver + artifact checksums
          generate_release_notes: true   # append GitHub's PR changelog below it
          draft: true                    # require manual review before the release is public
